<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Inventario</title><link rel="stylesheet" href="/css/estilos.css"></head>
<body data-pagina="Inventario y movimientos"><div id="encabezadoApp"></div><main><section class="seccion"><h2>Registrar movimiento manual</h2><p class="ayuda">Las piezas aceptadas por la inspección se agregan automáticamente como entradas de origen sensor.</p><div id="mensaje" class="mensaje"></div><form id="formularioMovimiento" class="formulario-grid"><div class="campo"><label for="producto">Producto</label><select id="producto" required></select></div><div class="campo"><label for="tipo">Movimiento</label><select id="tipo"><option value="entrada">Entrada</option><option value="salida">Salida</option></select></div><div class="campo"><label for="cantidad">Cantidad</label><input id="cantidad" type="number" min="1" step="1" value="1" required></div><button class="boton" type="submit">Registrar movimiento</button></form></section><section class="seccion"><h2>Historial</h2><div class="tabla-contenedor"><table><thead><tr><th>ID</th><th>Producto</th><th>Tipo</th><th>Cantidad</th><th>Existencia final</th><th>Origen</th><th>Inspección</th><th>Usuario</th><th>Fecha</th></tr></thead><tbody id="tablaMovimientos"></tbody></table></div></section></main><script src="/js/comun.js"></script><script src="/js/movimientos.js"></script></body></html>
