<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Registrar usuario</title><link rel="stylesheet" href="/css/estilos.css"></head>
<body><main class="contenedor-acceso"><h1>Registrar usuario</h1><p class="ayuda">El sistema también crea automáticamente el usuario inicial definido en el archivo <code>.env</code>.</p><div id="mensaje" class="mensaje"></div><form id="formularioRegistro"><label for="nombre">Nombre</label><input id="nombre" required><label for="correo">Correo</label><input id="correo" type="email" required><label for="contrasena">Contraseña</label><input id="contrasena" type="password" minlength="6" required><button class="boton" type="submit">Registrar</button></form><p><a href="/login">Regresar al inicio de sesión</a></p></main><script src="/js/registro.js"></script></body></html>
