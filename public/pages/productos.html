<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Productos</title><link rel="stylesheet" href="/css/estilos.css"></head>
<body data-pagina="Productos y especificaciones"><div id="encabezadoApp"></div><main><section class="seccion"><h2 id="tituloFormulario">Registrar producto</h2><p class="ayuda">Los campos de altura, peso y color pueden dejarse vacíos hasta terminar la calibración. Los porcentajes RGB deben sumar aproximadamente 100.</p><div id="mensaje" class="mensaje"></div><form id="formularioProducto"><input id="productoId" type="hidden"><div class="formulario-grid"><div class="campo"><label for="codigo">Código</label><input id="codigo" required placeholder="PZA-01"></div><div class="campo"><label for="nombre">Nombre</label><input id="nombre" required></div><div class="campo"><label for="tamano">Tamaño</label><input id="tamano" placeholder="pequeño, mediano..."></div><div class="campo"><label for="cantidad">Cantidad inicial</label><input id="cantidad" type="number" min="0" step="1" value="0"></div><div class="campo"><label for="alturaMin">Altura mínima (cm)</label><input id="alturaMin" type="number" step="0.01"></div><div class="campo"><label for="alturaMax">Altura máxima (cm)</label><input id="alturaMax" type="number" step="0.01"></div><div class="campo"><label for="pesoMin">Peso mínimo (g)</label><input id="pesoMin" type="number" step="0.01"></div><div class="campo"><label for="pesoMax">Peso máximo (g)</label><input id="pesoMax" type="number" step="0.01"></div><div class="campo"><label for="colorEsperado">Color esperado</label><input id="colorEsperado" placeholder="rojo"></div><div class="campo"><label for="refR">Referencia R (%)</label><input id="refR" type="number" step="0.01"></div><div class="campo"><label for="refG">Referencia G (%)</label><input id="refG" type="number" step="0.01"></div><div class="campo"><label for="refB">Referencia B (%)</label><input id="refB" type="number" step="0.01"></div><div class="campo"><label for="tolerancia">Tolerancia de color</label><input id="tolerancia" type="number" min="0" step="0.01" value="10"></div><div class="campo"><label for="activo">Estado</label><select id="activo"><option value="1">Activo</option><option value="0">Inactivo</option></select></div></div><div class="acciones"><button class="boton" type="submit">Guardar producto</button><button id="botonCancelar" class="boton boton-secundario oculto" type="button">Cancelar edición</button></div></form></section><section class="seccion"><h2>Productos registrados</h2><div class="tabla-contenedor"><table><thead><tr><th>ID</th><th>Código</th><th>Nombre</th><th>Existencia</th><th>Altura</th><th>Peso</th><th>Color</th><th>Estado</th><th>Acción</th></tr></thead><tbody id="tablaProductos"></tbody></table></div></section></main><script src="/js/comun.js"></script><script src="/js/productos.js"></script></body></html>
